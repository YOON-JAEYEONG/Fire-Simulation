; Recorded fire/smoke is part of simulation feedback at every effects quality.
; UE's Low/Medium presets disable heterogeneous volumes and also stop SVT frames.
[EffectsQuality@0]
r.HeterogeneousVolumes=1
r.HeterogeneousVolumes.DownsampleFactor=4
r.HeterogeneousVolumes.MaxStepCount=64

[EffectsQuality@1]
r.HeterogeneousVolumes=1
r.HeterogeneousVolumes.DownsampleFactor=3
r.HeterogeneousVolumes.MaxStepCount=96

[EffectsQuality@2]
r.HeterogeneousVolumes=1

[EffectsQuality@3]
r.HeterogeneousVolumes=1

[EffectsQuality@Cine]
r.HeterogeneousVolumes=1
